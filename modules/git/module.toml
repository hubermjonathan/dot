[module]
description = "Git configuration"

[links]
".gitconfig" = "~/.gitconfig"
".gitignore" = "~/.gitignore"

[deps]
brew = ["git", "gh"]

[setup]
interactive = true
provision = [
  { name = "gh-auth", run = "gh auth status >/dev/null 2>&1 || gh auth login --git-protocol ssh --web", check = "command_succeeds:gh auth status" },
]
