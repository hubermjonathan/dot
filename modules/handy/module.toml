[module]
name = "handy"
description = "Handy speech-to-text (parakeet model, ollama post-processing)"

[links]
"handy.json" = "~/.config/handy/handy.json"
"apply.sh" = "~/.config/handy/apply.sh"

[deps]
brew = ["hf"]

[apps]
cask = ["handy"]

[health]
checks = [
  { name = "app-installed", check = "command_succeeds:test -d /Applications/Handy.app" },
  { name = "settings-store", check = "command_succeeds:test -f ~/Library/Application\\ Support/com.pais.handy/settings_store.json" },
]

[setup]
post_link = [
  { name = "chmod-apply", run = "chmod +x ~/.config/handy/apply.sh" },
  { name = "apply-settings", run = "~/.config/handy/apply.sh" },
]
