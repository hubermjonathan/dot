[module]
description = "Handy speech-to-text (parakeet model, ollama post-processing)"

[links]
"handy.json" = "~/.config/handy/handy.json"
"apply.sh" = "~/.config/handy/apply.sh"

[deps]
brew = ["hf"]

[apps]
cask = ["handy"]

[health]
checks = [
  { name = "app-installed", check = "dir_exists:/Applications/Handy.app" },
  { name = "settings-store", check = "file_exists:~/Library/Application Support/com.pais.handy/settings_store.json" },
]

[setup]
post_link = [
  { name = "apply-settings", run = "~/.config/handy/apply.sh" },
]
