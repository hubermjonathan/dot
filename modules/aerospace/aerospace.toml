start-at-login = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 30

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.right = 8
outer.top = 8
outer.bottom = 8

[mode.main.binding]
ctrl-alt-h = 'focus left'
ctrl-alt-j = 'focus down'
ctrl-alt-k = 'focus up'
ctrl-alt-l = 'focus right'

ctrl-alt-shift-h = 'move left'
ctrl-alt-shift-j = 'move down'
ctrl-alt-shift-k = 'move up'
ctrl-alt-shift-l = 'move right'

ctrl-alt-shift-left = 'move-node-to-monitor prev'
ctrl-alt-shift-right = 'move-node-to-monitor next'

ctrl-alt-f = 'layout floating tiling'
ctrl-alt-e = 'layout tiles horizontal vertical'
ctrl-alt-s = 'layout v_accordion'
ctrl-alt-w = 'layout h_accordion'

ctrl-alt-up = 'fullscreen'

ctrl-alt-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'
