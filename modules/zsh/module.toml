[module]
description = "Zsh shell configuration"

[links]
".zshrc" = "~/.zshrc"
".zshenv" = "~/.zshenv"
"conf.d" = "~/.config/zsh"

[deps]
brew = ["zsh"]

# launchd only loads a root-owned daemon plist, so caf.plist is copied, not linked.
[setup]
interactive = true
post_link = [
  { name = "caf-daemon", run = "cmp -s ~/.config/zsh/caf.plist /Library/LaunchDaemons/dot.caf.plist && launchctl print system/dot.caf >/dev/null 2>&1 || { sudo launchctl bootout system/dot.caf 2>/dev/null; sudo install -m 644 -o root -g wheel ~/.config/zsh/caf.plist /Library/LaunchDaemons/dot.caf.plist && sudo launchctl bootstrap system /Library/LaunchDaemons/dot.caf.plist; }", check = "command_succeeds:cmp -s ~/.config/zsh/caf.plist /Library/LaunchDaemons/dot.caf.plist && launchctl print system/dot.caf >/dev/null" },
]
