[module]
name = "touchid"
description = "Touch ID authentication for sudo in terminal"

[health]
checks = [
  "file_exists:/etc/pam.d/sudo_local",
  "command_succeeds:grep -E '^[[:space:]]*auth[[:space:]]+sufficient[[:space:]]+pam_tid.so' /etc/pam.d/sudo_local",
]

[setup]
post_link = [
  "if grep -qE '^[[:space:]]*auth[[:space:]]+sufficient[[:space:]]+pam_tid.so' /etc/pam.d/sudo_local 2>/dev/null; then echo 'Touch ID for sudo already configured, skipping...'; else echo 'Configuring Touch ID for sudo (requires password)...'; printf 'auth       sufficient     pam_tid.so\\n' | sudo tee -a /etc/pam.d/sudo_local >/dev/null; fi",
]
