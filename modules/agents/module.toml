[module]
description = "Coding agent configuration"

[links]
"instructions.md" = "~/.claude/CLAUDE.md"
"claude/settings.json" = "~/.claude/settings.json"
"claude/scripts" = "~/.claude/scripts"
"hooks" = "~/.agents/hooks"

[deps]
brew = ["jq", "node", "qrencode"]

[health]
checks = [
  { name = "plugin-marketplace", check = "dir_exists:~/.claude/plugins/marketplaces/hubermjonathan" },
  { name = "technical-writing-skill", check = "command_succeeds:ls ~/.claude/plugins/cache/hubermjonathan/communication/*/skills/technical-writing/SKILL.md >/dev/null 2>&1" },
]

[setup]
post_link = [
  { name = "install-claude", run = "command -v claude >/dev/null || curl -fsSL https://claude.ai/install.sh | bash" },
  { name = "create-agents-local-md", run = "mkdir -p ~/.agents && touch ~/.agents/AGENTS.local.md" },
  { name = "add-blue-bubbles-mcp", run = "claude mcp get blue-bubbles >/dev/null 2>&1 || claude mcp add --scope user --transport http blue-bubbles http://macbook:8723/mcp --header 'Authorization: Bearer ${BLUE_BUBBLES_TOKEN}'", check = "command_succeeds:claude mcp get blue-bubbles" },
]
