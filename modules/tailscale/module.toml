[module]
name = "tailscale"
description = "Tailscale network"

[deps]
brew = ["tailscale"]

[setup]
interactive = true
provision = [
  { name = "start-daemon", run = "ls /Library/LaunchDaemons/*tailscale.plist >/dev/null 2>&1 || sudo brew services start tailscale", check = "command_succeeds:pgrep -x tailscaled" },
  { name = "up", run = "tailscale status >/dev/null 2>&1 || sudo tailscale up --operator=$USER", check = "command_succeeds:tailscale status" },
]
