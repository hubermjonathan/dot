[module]
description = "macOS system preferences"

[links]
"wallpaper.jpg" = "~/Pictures/wallpaper.jpg"
"profile-picture.jpg" = "~/Pictures/profile-picture.jpg"
"zoom-background.jpg" = "~/Pictures/zoom-background.jpg"

[deps]
brew = ["defaultbrowser"]

[apps]
cask = ["desktoppr"]

[setup]
interactive = true
post_link = [
  { name = "sudo-touchid", run = "grep -qE '^[[:space:]]*auth[[:space:]]+sufficient[[:space:]]+pam_tid.so' /etc/pam.d/sudo_local 2>/dev/null || printf 'auth       sufficient     pam_tid.so\\n' | sudo tee -a /etc/pam.d/sudo_local >/dev/null", check = "command_succeeds:grep -E '^[[:space:]]*auth[[:space:]]+sufficient[[:space:]]+pam_tid.so' /etc/pam.d/sudo_local" },
  { name = "dark-mode", run = "osascript -e 'tell application \"System Events\" to tell appearance preferences to set dark mode to true'" },
  { name = "dock-autohide", run = "defaults write com.apple.dock autohide -bool true" },
  { name = "dock-no-magnification", run = "defaults write com.apple.dock magnification -bool false" },
  { name = "dock-clear-apps", run = "defaults write com.apple.dock persistent-apps -array" },
  { name = "dock-clear-others", run = "defaults write com.apple.dock persistent-others -array" },
  { name = "dock-clear-recents", run = "defaults write com.apple.dock recent-apps -array" },
  { name = "dock-hide-recents", run = "defaults write com.apple.dock show-recents -bool false" },
  { name = "hot-corner-br", run = "defaults write com.apple.dock wvous-br-corner -int 4" },
  { name = "clock-seconds", run = "defaults write com.apple.menuextra.clock ShowSeconds -bool true" },
  { name = "hide-desktop-widgets", run = "defaults write com.apple.WindowManager showStandardWidgets -bool false" },
  { name = "hide-stage-manager-widgets", run = "defaults write com.apple.WindowManager showStageManagerWidgets -bool false" },
  { name = "no-edge-tiling", run = "defaults write com.apple.WindowManager EnableTilingByEdgeDrag -bool false" },
  { name = "no-top-edge-tiling", run = "defaults write com.apple.WindowManager EnableTopTilingByEdgeDrag -bool false" },
  { name = "no-tiling-option-key", run = "defaults write com.apple.WindowManager EnableTilingOptionAccelerator -bool false" },
  { name = "no-tiled-margins", run = "defaults write com.apple.WindowManager EnableTiledWindowMargins -bool false" },
  { name = "clear-notification-widgets", run = "python3 -c \"import plistlib,subprocess,tempfile,os; r=subprocess.run(['defaults','export','com.apple.notificationcenterui','-'],capture_output=True); p=plistlib.loads(r.stdout); p['widgets']={'instances':[],'vers':1}; f=tempfile.NamedTemporaryFile(suffix='.plist',delete=False); plistlib.dump(p,f); f.close(); subprocess.run(['defaults','import','com.apple.notificationcenterui',f.name]); os.unlink(f.name)\"" },
  # AppleFirstWeekday counts Sunday as 1, iCal counts it as 0
  { name = "week-starts-monday", run = "defaults write NSGlobalDomain AppleFirstWeekday -dict gregorian 2" },
  { name = "calendar-week-starts-monday", run = "defaults write com.apple.iCal 'first day of week' -int 1" },
  { name = "natural-scroll-off", run = "defaults write NSGlobalDomain com.apple.swipescrolldirection -bool false" },
  { name = "fn-keys-standard", run = "defaults write NSGlobalDomain com.apple.keyboard.fnState -bool true" },
  { name = "no-auto-capitalize", run = "defaults write NSGlobalDomain NSAutomaticCapitalizationEnabled -bool false" },
  { name = "no-auto-period", run = "defaults write NSGlobalDomain NSAutomaticPeriodSubstitutionEnabled -bool false" },
  { name = "chrome-new-tab-right", run = "defaults write com.google.Chrome NSUserKeyEquivalents -dict-add 'New Tab to the Right' '@^t'" },
  { name = "terminal-default-profile", run = "defaults write com.apple.Terminal 'Default Window Settings' -string Basic" },
  { name = "terminal-startup-profile", run = "defaults write com.apple.Terminal 'Startup Window Settings' -string Basic" },
  # defaultbrowser can't detect the current default here, so it would show the confirm dialog on every link
  { name = "default-browser", run = "osascript -l JavaScript -e 'ObjC.import(\"AppKit\"); $.NSWorkspace.sharedWorkspace.URLForApplicationToOpenURL($.NSURL.URLWithString(\"https:\")).path.js' | grep -q 'Google Chrome' || defaultbrowser chrome", check = "command_succeeds:osascript -l JavaScript -e 'ObjC.import(\"AppKit\"); $.NSWorkspace.sharedWorkspace.URLForApplicationToOpenURL($.NSURL.URLWithString(\"https:\")).path.js' | grep -q 'Google Chrome'" },
  { name = "finder-new-window-target", run = "defaults write com.apple.finder NewWindowTarget -string PfLo" },
  { name = "finder-new-window-path", run = "defaults write com.apple.finder NewWindowTargetPath -string \"file://$HOME/Downloads/\"" },
  { name = "finder-empty-old-trash", run = "defaults write com.apple.finder FXRemoveOldTrashItems -bool true" },
  { name = "finder-hide-recent-tags", run = "defaults write com.apple.finder ShowRecentTags -bool false" },
  { name = "activate-settings", run = "/System/Library/PrivateFrameworks/SystemAdministration.framework/Resources/activateSettings -u" },
  { name = "set-wallpaper", run = "desktoppr ~/Pictures/wallpaper.jpg" },
  { name = "profile-picture", run = "dscl . read /Users/$USER Picture | grep -q \"$HOME/Pictures/profile-picture.jpg\" && dscl . read /Users/$USER JPEGPhoto 2>&1 | grep -q 'No such key' || { sudo dscl . delete /Users/$USER JPEGPhoto 2>/dev/null; sudo dscl . create /Users/$USER Picture \"$HOME/Pictures/profile-picture.jpg\"; }" },
  { name = "restart-ui", run = "for s in com.apple.Dock.agent com.apple.Finder com.apple.notificationcenterui.agent com.apple.SystemUIServer.agent com.apple.WindowManager.agent; do launchctl kickstart -k gui/$(id -u)/$s; done" },
]
provision = [
  { name = "finder-sidebar-reminder", run = "echo 'MANUAL: Finder > Settings > Sidebar — uncheck Recents, Shared; check Pictures'" },
]
