[module]
name = "claude"
description = "Claude Code configuration"

[links]
"user-global.md" = "~/.claude/CLAUDE.md"
"settings.json" = "~/.claude/settings.json"
"scripts" = "~/.claude/scripts"

[deps]
brew = ["node"]

[health]
checks = [
  "dir_exists:~/.claude/plugins/marketplaces/hubermjonathan",
  "command_succeeds:ls ~/.claude/plugins/cache/hubermjonathan/skills/*/skills/caveman/SKILL.md >/dev/null 2>&1",
  "file_exists:~/.claude/caveman-mode",
]

[setup]
post_link = [
  "command -v claude >/dev/null || curl -fsSL https://claude.ai/install.sh | bash",
  "chmod +x ~/.claude/scripts/*.sh",
  "touch ~/.claude/CLAUDE.local.md",
  "[ -f ~/.claude/caveman-mode ] || echo ultra > ~/.claude/caveman-mode",
]
