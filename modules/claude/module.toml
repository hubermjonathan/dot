[module]
name = "claude"
description = "Claude Code configuration"

[links]
"user-global.md" = "~/.claude/CLAUDE.md"
"settings.json" = "~/.claude/settings.json"
"scripts" = "~/.claude/scripts"

[deps]
brew = ["node"]

[health]
checks = [
  { name = "plugin-marketplace", check = "dir_exists:~/.claude/plugins/marketplaces/hubermjonathan" },
  { name = "technical-writing-skill", check = "command_succeeds:ls ~/.claude/plugins/cache/hubermjonathan/skills/*/skills/*/technical-writing/SKILL.md >/dev/null 2>&1" },
]

[setup]
post_link = [
  { name = "install-claude", run = "command -v claude >/dev/null || curl -fsSL https://claude.ai/install.sh | bash" },
  { name = "chmod-scripts", run = "chmod +x ~/.claude/scripts/*.sh" },
  { name = "create-agents-local-md", run = "mkdir -p ~/.agents && touch ~/.agents/AGENTS.local.md" },
]
