[module]
name = "claude"
description = "Claude Code configuration"

[links]
"user-global.md" = "~/.claude/CLAUDE.md"
"settings.repo.json" = "~/.claude/settings.repo.json"
"merge-settings.sh" = "~/.claude/merge-settings.sh"
"check-settings.sh" = "~/.claude/check-settings.sh"
"statusline-command.sh" = "~/.claude/statusline-command.sh"

[setup]
post_link = [
  "command -v claude >/dev/null || curl -fsSL https://claude.ai/install.sh | bash",
  "chmod +x ~/.claude/statusline-command.sh ~/.claude/merge-settings.sh ~/.claude/check-settings.sh",
  "if [ -L \"$HOME/.claude/settings.local.json\" ]; then rm \"$HOME/.claude/settings.local.json\"; fi",
  "bash ~/.claude/merge-settings.sh",
]
