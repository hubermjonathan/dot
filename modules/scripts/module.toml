[module]
name = "scripts"
description = "AppleScript utilities compiled to .app bundles"

[links]
"src" = "~/.config/scripts"

[deps]
brew = ["jq"]

[setup]
post_link = [
  "mkdir -p ~/Applications/Scripts",
  "for f in ~/.config/scripts/*.applescript; do name=$(basename \"$f\" .applescript); osacompile -o \"$HOME/Applications/Scripts/$name.app\" \"$f\"; done",
]
