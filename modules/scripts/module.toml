[module]
name = "scripts"
description = "AppleScript utilities compiled to .app bundles"

[links]
"src" = "~/.config/scripts"

[deps]
brew = ["jq"]

[setup]
post_link = [
  "mkdir -p ~/Applications/Scripts",
  "for f in ~/.config/scripts/*.applescript; do osacompile -o ~/Applications/Scripts/$(basename \"$f\" .applescript).app \"$f\"; done",
]
