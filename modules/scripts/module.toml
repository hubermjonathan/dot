[module]
name = "scripts"
description = "AppleScript utilities compiled to .app bundles"

[links]
"src" = "~/.config/scripts"
"icons" = "~/.config/scripts-icons"

[deps]
brew = ["jq"]

[setup]
post_link = [
  "mkdir -p ~/Applications/Scripts",
  "for f in ~/.config/scripts/*.applescript; do name=$(basename \"$f\" .applescript); app=\"$HOME/Applications/Scripts/$name.app\"; osacompile -o \"$app\" \"$f\"; icon=\"$HOME/.config/scripts-icons/$name.icns\"; if [ -f \"$icon\" ]; then cp \"$icon\" \"$app/Contents/Resources/applet.icns\"; /usr/libexec/PlistBuddy -c \"Set :CFBundleIconFile applet.icns\" \"$app/Contents/Info.plist\" 2>/dev/null || /usr/libexec/PlistBuddy -c \"Add :CFBundleIconFile string applet.icns\" \"$app/Contents/Info.plist\"; touch \"$app\"; fi; done",
]
