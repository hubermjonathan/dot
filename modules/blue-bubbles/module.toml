[module]
description = "blue-bubbles iMessage gateway, for the Mac signed in to the agent's Apple ID"

[links]
"launch-agent.plist" = "~/.config/blue-bubbles/launch-agent.plist"

[deps]
brew = ["steipete/tap/imsg"]

[health]
checks = [
  { name = "config", check = "file_exists:~/.config/blue-bubbles/config.yaml" },
]

[setup]
provision = [
  # Full Disk Access is tied to the binary's signature, and an ad-hoc one changes with every build.
  { name = "create-signing-identity", run = "security find-identity -p codesigning | grep -q '\"blue-bubbles\"' || { d=$(mktemp -d) && /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj /CN=blue-bubbles -addext keyUsage=critical,digitalSignature -addext extendedKeyUsage=critical,codeSigning -keyout $d/key.pem -out $d/cert.pem && /usr/bin/openssl pkcs12 -export -inkey $d/key.pem -in $d/cert.pem -out $d/id.p12 -passout pass:import && security import $d/id.p12 -k ~/Library/Keychains/login.keychain-db -P import -T /usr/bin/codesign; rm -rf $d; }", check = "command_succeeds:security find-identity -p codesigning | grep -q '\"blue-bubbles\"'" },
  { name = "install-gateway", run = "test -x ~/go/bin/blue-bubbles || { go install github.com/hubermjonathan/blue-bubbles@latest && codesign -fs blue-bubbles ~/go/bin/blue-bubbles; }", check = "command_succeeds:codesign -dv ~/go/bin/blue-bubbles 2>&1 | grep -q Identifier=blue-bubbles" },
  { name = "start-launch-agent", run = "launchctl print gui/$(id -u)/com.hubermjonathan.blue-bubbles >/dev/null 2>&1 || { sed \"s|~|$HOME|g\" ~/.config/blue-bubbles/launch-agent.plist > ~/Library/LaunchAgents/com.hubermjonathan.blue-bubbles.plist && launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.hubermjonathan.blue-bubbles.plist; }", check = "command_succeeds:launchctl print gui/$(id -u)/com.hubermjonathan.blue-bubbles" },
]
