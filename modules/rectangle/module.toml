[module]
name = "rectangle"
description = "Rectangle window manager (grid resize + move-to-display)"

[links]
"RectangleConfig.json" = "~/.config/rectangle/RectangleConfig.json"
"apply.sh" = "~/.config/rectangle/apply.sh"

[apps]
cask = ["rectangle"]

[health]
checks = [
  { name = "app-installed", check = "command_succeeds:test -d /Applications/Rectangle.app" },
]

[setup]
post_link = [
  { name = "chmod-apply", run = "chmod +x ~/.config/rectangle/apply.sh" },
  { name = "apply-settings", run = "~/.config/rectangle/apply.sh" },
  { name = "restart-rectangle", run = "pgrep -x Rectangle >/dev/null && killall Rectangle; open -gja Rectangle" },
]
